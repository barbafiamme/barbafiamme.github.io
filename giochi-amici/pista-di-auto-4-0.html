<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pista di auto 4.0</title>
<style>
:root{--ink:#1f1d2b;--paper:#fffdf6;--sun:#ffc93c;--scrim:rgba(31,29,43,.6);--display:Impact,'Arial Black',sans-serif;--body:'Trebuchet MS',system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#3f9d63;color:var(--ink);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:var(--scrim);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 20px;box-sizing:border-box;z-index:5}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px 18px 24px 16px;box-shadow:6px 7px 0 var(--ink);width:100%;max-width:520px;padding:20px;box-sizing:border-box;margin:auto 0;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
h1{font-size:clamp(30px,8vw,44px)}h1 span{background:var(--sun);padding:0 .15em;border-radius:6px}
h2{font-size:clamp(26px,6vw,34px)}
.panel p{margin:0;font-size:18px;line-height:1.35}.panel ul{margin:0;padding-left:20px;font-size:17px;line-height:1.4}
.btn{align-self:flex-start;font-family:var(--display);font-size:22px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px 22px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:3px dashed #2f6fe4;outline-offset:3px}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-family:var(--display);font-size:18px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
#pad{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:2}
#pad button{pointer-events:auto;width:88px;height:88px;font-size:40px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:4px 4px 0 var(--ink);opacity:.9}
#pad button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
#toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(40px,12vw,90px);color:#fff;text-shadow:4px 4px 0 var(--ink);pointer-events:none;z-index:3;white-space:nowrap}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud" hidden><div class="pill" id="pos">🏁 1° posto</div><div class="pill" id="pts">⭐ 0</div></div>
<div id="pad" hidden><button id="bl" aria-label="Sinistra">◀</button><button id="br" aria-label="Destra">▶</button></div>
<div id="toast" hidden></div>
<div class="overlay" id="start"><div class="panel">
<h1>Pista di <span>auto 4.0</span></h1>
<p>Corri sulla pista del negozio! <b>Chi arriva primo vince la Coppa</b> 🏆</p>
<ul><li>Telefono: usa le frecce ◀ ▶ o tocca a sinistra e a destra.</li><li>Computer: frecce ← → oppure A e D.</li><li>Prendi le stelle ⭐ per correre più veloce. Evita i coni 🔶!</li></ul>
<button class="btn" id="go">Via!</button></div></div>
<div class="overlay" id="end" hidden><div class="panel">
<h2 id="etitle"></h2><p id="etext"></p><div id="board"></div>
<button class="btn" id="again">Un'altra corsa</button></div></div>
<script src="../classifica.js"></script>
<script>
if(window.Classifica)Classifica.register('pista-di-auto-4-0',{title:'Pista di auto 4.0',unit:'punti'});
const $=id=>document.getElementById(id),cv=$('game'),c=cv.getContext('2d');
let W,H,RW,RX,LW;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;RW=Math.min(W*.72,360);RX=(W-RW)/2;LW=RW/3}
addEventListener('resize',size);size();
const LEN=7000,COL=['#e0382f','#2f6fe4','#f2a81d'];
let me,rivals,items,t,running=false,last=0,keys={},stars,place,finished,prog0,scroll;
const lx=l=>RX+LW*(l+.5);
function mk(){items=[];for(let d=600;d<LEN-400;d+=180+Math.random()*160){const l=Math.floor(Math.random()*3);items.push({d,l,k:Math.random()<.45?'star':'cone',on:1})}}
function start(){mk();me={lane:1,x:lx(1),d:0,v:0,tgt:1,slow:0,boost:0};
 rivals=[0,2,1].map((l,i)=>({lane:l,x:lx(l),d:120+i*60,v:0,base:300+i*18+Math.random()*10,col:COL[i],nl:1+Math.random()*2}));
 stars=0;t=0;finished=false;place=0;running=true;last=performance.now();
 for(const e of['start','end'])$(e).hidden=true;$('hud').hidden=false;$('pad').hidden=!matchMedia('(pointer:coarse)').matches&&innerWidth>900;
 toast('Pronti... VIA!');hud();requestAnimationFrame(loop)}
function toast(s){const e=$('toast');e.textContent=s;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,900)}
function rank(){return 1+rivals.filter(r=>r.d>me.d).length}
function hud(){$('pos').textContent='🏁 '+rank()+'° posto';$('pts').textContent='⭐ '+stars}
function steer(dir){if(!running)return;me.tgt=Math.max(0,Math.min(2,me.tgt+dir))}
function loop(now){if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){t+=dt;
 const top=330+(me.boost>0?170:0)-(me.slow>0?170:0);me.v+=(top-me.v)*Math.min(1,dt*3);
 me.boost-=dt;me.slow-=dt;me.d+=me.v*dt;me.lane=me.tgt;me.x+=(lx(me.tgt)-me.x)*Math.min(1,dt*12);
 for(const r of rivals){r.nl-=dt;if(r.nl<=0){r.lane=Math.floor(Math.random()*3);r.nl=1.5+Math.random()*2.5}
  r.x+=(lx(r.lane)-r.x)*Math.min(1,dt*6);r.v=r.base+(Math.sin(t*1.3+r.base)*25);r.d+=r.v*dt;if(r.d>=LEN&&!r.fin){r.fin=1}}
 for(const it of items){if(!it.on)continue;if(Math.abs(it.d-me.d)<26&&Math.abs(lx(it.l)-me.x)<LW*.4){it.on=0;
  if(it.k==='star'){stars++;me.boost=1.6;me.slow=0}else{me.slow=1.2;me.boost=0;toast('Ops! 🔶')}}}
 hud();
 if(me.d>=LEN)finish();else if(rivals.some(r=>r.d>=LEN+250))finish()}
function finish(){if(finished)return;finished=true;running=false;place=rank();if(me.d<LEN)place=4;
 $('hud').hidden=true;$('pad').hidden=true;
 const pts=Math.max(1,(4-place)*100+stars*20+(place<4?Math.max(0,Math.round(60-t))*2:0)+Math.round(Math.min(me.d,LEN)/100));
 $('etitle').textContent=place===1?'Hai vinto la Coppa! 🏆':place===2?'Secondo posto, bravissimo! 🥈':place===3?'Terzo posto, bravo! 🥉':'Che bella corsa! Riprova!';
 $('etext').textContent='Hai preso '+stars+' stelle e fatto '+pts+' punti!';$('end').hidden=false;
 if(window.Classifica)Classifica.mount($('board'),'pista-di-auto-4-0',pts)}
function car(x,y,col,w){const h=w*1.8;c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(x+4,y+h*.5,w*.6,h*.5,0,0,7);c.fill();
 c.fillStyle=col;c.strokeStyle='#1f1d2b';c.lineWidth=3;c.beginPath();c.roundRect(x-w/2,y-h/2,w,h,w*.3);c.fill();c.stroke();
 c.fillStyle='#bfe6ff';c.beginPath();c.roundRect(x-w*.35,y-h*.18,w*.7,h*.26,4);c.fill();c.stroke();
 c.fillStyle='#fff';c.fillRect(x-w*.38,y-h*.46,w*.2,h*.07);c.fillRect(x+w*.18,y-h*.46,w*.2,h*.07);
 c.fillStyle='#1f1d2b';for(const sx of[-1,1])for(const sy of[-.3,.3])c.fillRect(x+sx*w*.55-(sx>0?0:w*.12),y+sy*h-h*.1,w*.12,h*.2)}
function tree(x,y,s){c.fillStyle='#8a5a2b';c.fillRect(x-s*.08,y,s*.16,s*.45);c.fillStyle='#1f7a4a';c.strokeStyle='#145a34';c.lineWidth=2;c.beginPath();c.arc(x,y-s*.05,s*.4,0,7);c.fill();c.stroke()}
function draw(){const py=H*.74,sc=1;c.fillStyle='#4cae6c';c.fillRect(0,0,W,H);
 c.fillStyle='#4a4f5a';c.fillRect(RX,0,RW,H);c.fillStyle='#2f9e60';c.fillRect(RX-8,0,8,H);c.fillRect(RX+RW,0,8,H);
 c.strokeStyle='#fff';c.lineWidth=5;c.beginPath();c.moveTo(RX,0);c.lineTo(RX,H);c.moveTo(RX+RW,0);c.lineTo(RX+RW,H);c.stroke();
 const off=me.d%80;c.lineWidth=4;c.setLineDash([36,44]);c.lineDashOffset=-off*1;for(const k of[1,2]){c.beginPath();c.moveTo(RX+LW*k,-80+off);c.lineTo(RX+LW*k,H+80);c.stroke()}c.setLineDash([]);
 const Y=d=>py-(d-me.d);
 for(let d=Math.floor(me.d/200)*200-200;d<me.d+H;d+=200){const y=Y(d),s=H*.09+20;tree(RX*.5+((d/200*37)%20),y,s);tree(RX+RW+(W-RX-RW)*.5-((d/200*23)%20),y-100,s)}
 // traguardo e coppa
 const fy=Y(LEN);if(fy>-60&&fy<H+60){for(let i=0;i<12;i++)for(let j=0;j<2;j++){c.fillStyle=(i+j)%2?'#fff':'#1f1d2b';c.fillRect(RX+i*RW/12,fy-20+j*20,RW/12,20)}
  const sx=RX+RW+Math.min(70,(W-RX-RW)/2);c.fillStyle='#fff';c.strokeStyle='#1f1d2b';c.lineWidth=4;c.fillRect(sx-34,fy-90,68,80);c.strokeRect(sx-34,fy-90,68,80);c.font='44px serif';c.textAlign='center';c.fillText('🏆',sx,fy-34)}
 for(const it of items){if(!it.on)continue;const y=Y(it.d);if(y<-40||y>H+40)continue;
  if(it.k==='star'){c.font='34px serif';c.textAlign='center';c.fillText('⭐',lx(it.l),y+12)}
  else{c.fillStyle='#ff7a1a';c.strokeStyle='#1f1d2b';c.lineWidth=3;c.beginPath();c.moveTo(lx(it.l),y-20);c.lineTo(lx(it.l)+16,y+14);c.lineTo(lx(it.l)-16,y+14);c.closePath();c.fill();c.stroke();c.fillStyle='#fff';c.fillRect(lx(it.l)-8,y,16,5)}}
 const cw=Math.min(LW*.5,46);
 for(const r of rivals){const y=Y(r.d);if(y>-100&&y<H+100)car(r.x,y,r.col,cw)}
 car(me.x,py,'#1fa25a',cw);
 if(me.boost>0){c.fillStyle='#ffc93c';c.beginPath();c.moveTo(me.x-8,py+cw*.9);c.lineTo(me.x,py+cw*.9+30);c.lineTo(me.x+8,py+cw*.9);c.fill()}
 // barra di avanzamento
 const bx=12,by=H*.18,bh=H*.5;c.fillStyle='rgba(255,255,255,.7)';c.fillRect(bx,by,10,bh);c.font='16px serif';c.textAlign='center';c.fillText('🏆',bx+5,by-4);
 for(const r of rivals){c.fillStyle=r.col;c.beginPath();c.arc(bx+5,by+bh*(1-Math.min(1,r.d/LEN)),6,0,7);c.fill()}
 c.fillStyle='#1fa25a';c.strokeStyle='#1f1d2b';c.lineWidth=2;c.beginPath();c.arc(bx+5,by+bh*(1-Math.min(1,me.d/LEN)),8,0,7);c.fill();c.stroke()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k])return;keys[k]=1;if(k==='arrowleft'||k==='a')steer(-1);if(k==='arrowright'||k==='d')steer(1);if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>{delete keys[e.key.toLowerCase()]});
cv.addEventListener('pointerdown',e=>steer(e.clientX<innerWidth/2?-1:1));
for(const[id,d]of[['bl',-1],['br',1]])$(id).addEventListener('pointerdown',e=>{e.stopPropagation();steer(d)});
$('go').onclick=start;$('again').onclick=start;
me={x:lx(1),d:0,boost:0,slow:0};rivals=[0,2,1].map((l,i)=>({x:lx(l),d:120+i*60,col:COL[i]}));items=[];draw();
</script></body></html>
