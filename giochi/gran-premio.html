<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Gran Premio dei Disegni</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen oval speedway canvas, paper-and-marker overlays like the drawings */
:root{
  --ink:#1f1d2b; --paper:#fffdf6; --sun:#ffc93c; --grass:#5aa952; --scrim:rgba(31,29,43,.55); --muted:#6b6880;
  --display:'Bungee',Impact,'Arial Black',sans-serif; --body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#game{position:fixed;inset:0;display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:var(--scrim);
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-sizing:border-box;touch-action:pan-y}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px 18px 24px 16px;box-shadow:6px 7px 0 var(--ink);
  width:100%;max-width:640px;padding:22px 20px 20px;box-sizing:border-box;margin:auto 0;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(28px,7vw,44px)}
h1 span{background:var(--sun);padding:0 .15em;border-radius:6px}
h2{font-size:clamp(26px,6vw,38px)}
.lead{margin:0;font-size:18px;color:var(--muted);font-weight:500}
#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.car{font:inherit;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 8px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,box-shadow .15s;color:var(--ink)}
.car canvas{width:100%;height:auto;aspect-ratio:2/1;max-width:100%}
.car b{font-size:17px;font-weight:800}
.car small{font-size:13px;color:var(--muted);font-weight:500}
.car[aria-pressed="true"]{background:#fff4cf;box-shadow:4px 5px 0 var(--ink);transform:translateY(-3px) rotate(-1deg)}
.car:focus-visible,button:focus-visible{outline:3px dashed #2f6fe4;outline-offset:3px}
.btn{font-family:var(--display);font-size:22px;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  padding:12px 22px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
.keys{margin:0;font-size:14px;color:var(--muted)}
.howto{margin:0;font-size:20px;font-weight:700;line-height:1.35}
.howto b{background:#f39025;color:#fff;padding:0 .3em;border-radius:6px}
.stars{font-size:40px;letter-spacing:6px;color:var(--sun);-webkit-text-stroke:2px var(--ink);text-align:center;margin:0}
#results{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
#results li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding:6px 10px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:17px}
#results li.me{background:#fff4cf;font-weight:800}
#results .p{font-family:var(--display)}
#results .t{font-variant-numeric:tabular-nums;color:var(--muted)}
#results i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);vertical-align:-2px;margin-right:6px}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.pill{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-family:var(--display);font-size:18px;box-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.pill small{font-family:var(--body);font-weight:700;font-size:13px;display:block;line-height:1;color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:130px;height:80px;background:rgba(255,253,246,.85);border:3px solid var(--ink);border-radius:12px}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--display);font-size:min(30vw,180px);color:var(--sun);-webkit-text-stroke:4px var(--ink);text-shadow:8px 8px 0 var(--ink)}
#count.pop{animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(1.6)}to{transform:scale(1)}}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;pointer-events:none}
#controls .grp{display:flex;gap:12px;pointer-events:auto;align-items:flex-end}
.ctl{width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,253,246,.8);font-family:var(--display);
  font-size:26px;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);touch-action:none}
.ctl.small{font-size:14px}
.ctl.gas{background:rgba(255,201,60,.92);width:88px;height:88px}
.ctl.on{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);filter:brightness(.9)}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.meter{width:96px;height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:3px 0 2px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#e63946,#f39025,#ffc93c);width:100%}
.ctl.turbo{background:rgba(243,144,37,.95);width:110px;height:110px;font-size:18px}
.ctl.turbo.low{opacity:.45}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 120px);text-align:center;font-family:var(--display);font-size:clamp(26px,7vw,46px);
  color:var(--sun);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none}
#toast.pop{animation:pop .5s ease-out}
#confetti{position:fixed;inset:0;pointer-events:none}
#podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
#podium div{display:flex;flex-direction:column;align-items:center;min-width:0}
#podium canvas{width:100%;height:auto;aspect-ratio:2/1}
#podium span{width:100%;border:3px solid var(--ink);border-radius:10px 10px 0 0;font-family:var(--display);text-align:center;font-size:22px;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){#toast.pop{animation:none}#count.pop{animation:none}.car{transition:none}}
</style>

  </div>
</section>

<section id="end" class="overlay" hidden>
  <div class="panel">
    <h2 id="endTitle"></h2>
    <p class="stars" id="stars"></p>
    <div id="podium"></div>
    <ol id="results"></ol>
    <div class="row"><button class="btn" id="again">Gioca ancora!</button><button class="btn ghost" id="change">Cambia auto</button></div>
  </div>
</section>

<div id="toast" hidden></div>

<script>
(()=>{
const ROSTER=[
  {id:'azzurro',name:'Turbo Azzurro',drawn:true,num:'20',body:'#4cc9e0',accent:'#3b3fbf',wheel:'#3b3fbf',spoiler:'#1f1f1f',shape:'sport'},
  {id:'grigio',name:'Grigio Smeraldo',drawn:true,num:'9',body:'#a6a6ad',accent:'#7ed321',wheel:'#8f8f96',spoiler:'#1f1f1f',shape:'wedge'},
  {id:'lime',name:'Lime Sprint',drawn:true,num:'',body:'#7cc934',accent:'#f5c518',wheel:'#f5c518',spoiler:'#6ab52a',shape:'bubble'},
  {id:'viola',name:'Viola Arancio',drawn:true,num:'2',body:'#5b3a8e',accent:'#f39025',wheel:'#5b3a8e',spoiler:'#5b3a8e',shape:'muscle'},
  {id:'rosso',name:'Rosso Bisonte',drawn:false,num:'33',body:'#d62828',accent:'#ffffff',wheel:'#2a2a2a',spoiler:'#1f1f1f',shape:'truck'},
  {id:'cometa',name:'Cometa Blu',drawn:false,num:'5',body:'#ffffff',accent:'#1d4fd6',wheel:'#2a2a2a',spoiler:'#d62828',shape:'stock'},
  {id:'rally',name:'Rally Celeste',drawn:false,num:'8',body:'#7fd3f0',accent:'#e0262b',wheel:'#2a2a2a',spoiler:'#e0262b',shape:'rally'},
  {id:'drago',name:'Drago Verde',drawn:false,num:'17',body:'#1f6b3a',accent:'#ffc21a',wheel:'#2a2a2a',spoiler:'#14482a',shape:'gt'},
  {id:'bosco',name:'Bosco Turbo',drawn:false,num:'12',body:'#5b8f2a',accent:'#f27a1a',wheel:'#8a5a2b',spoiler:'#6b4220',shape:'buggy'}
];
const LAPS=3, TW=120, APRON=50, MAXV=560, ACC=360, BRAKE=720, CS=1.25;

/* ---------- oval track (counter-clockwise, left turns) ---------- */
const L=1600,R=470,PER=2*L+2*Math.PI*R;
function posAt(s){let u=((s+L/2)%PER+PER)%PER;
  if(u<L)return{x:u,y:R,a:0};u-=L;
  if(u<Math.PI*R){const t=u/R,th=Math.PI/2-t;return{x:L+R*Math.cos(th),y:R*Math.sin(th),a:-t}}u-=Math.PI*R;
  if(u<L)return{x:L-u,y:-R,a:Math.PI};u-=L;
  const t=u/R,th=-Math.PI/2-t;return{x:R*Math.cos(th),y:R*Math.sin(th),a:Math.PI-t}}
const N=Math.round(PER/12),PTS=[];for(let i=0;i<N;i++)PTS.push(posAt(i*PER/N));
const nx=p=>-Math.sin(p.a),ny=p=>Math.cos(p.a);
function offPoly(path,lat){PTS.forEach((p,i)=>{const x=p.x+nx(p)*lat,y=p.y+ny(p)*lat;i?path.lineTo(x,y):path.moveTo(x,y)});path.closePath();return path}
function ring(a,b){const p=new Path2D();offPoly(p,a);offPoly(p,b);return p}
const P={stands:ring(TW+18,TW+250),roof:ring(TW+250,TW+275),wall:ring(TW,TW+18),road:ring(-TW,TW),apron:ring(-TW-APRON,-TW),infield:offPoly(new Path2D(),-TW-APRON)};
const line=lat=>offPoly(new Path2D(),lat);
const LINES={outer:line(TW-6),y1:line(-TW+8),y2:line(-TW+16),wallMid:line(TW+9)};
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=11;const rnd=()=>((seed=(seed*16807)%2147483647)-1)/2147483646;
const CROWD_COLS=['#e63946','#ffc93c','#2f6fe4','#ffffff','#7cc934','#f39025','#5b3a8e','#4cc9e0'];
const crowd=[];for(let k=0;k<2600;k++){const p=PTS[Math.floor(rnd()*N)],lat=TW+34+rnd()*205;crowd.push({x:p.x+nx(p)*lat,y:p.y+ny(p)*lat,c:CROWD_COLS[Math.floor(rnd()*8)]})}
const BX={minX:-R-TW-280,maxX:L+R+TW+280,minY:-R-TW-280,maxY:R+TW+280};

/* ---------- canvas ---------- */
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');let W=0,H=0,DPR=1,Z=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);cvs.style.width=W+'px';cvs.style.height=H+'px';Z=clamp(Math.min(W,H)/560,.62,1.1)}
window.addEventListener('resize',resize);resize();
const DF=()=>getComputedStyle(document.documentElement).getPropertyValue('--display');

/* ---------- side view (menu) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fill()}
const SHAPES={
  sport:{path(c){c.moveTo(20,80);c.lineTo(22,52);c.quadraticCurveTo(60,44,92,42);c.lineTo(122,24);c.lineTo(150,26);c.lineTo(166,42);c.quadraticCurveTo(202,46,206,64);c.lineTo(206,80);c.closePath()},
    win(c){c.moveTo(102,42);c.lineTo(124,29);c.lineTo(148,31);c.lineTo(160,42);c.closePath()},wheels:[58,168],wy:82,rx:17,ry:20},
  wedge:{path(c){c.moveTo(18,80);c.lineTo(20,48);c.lineTo(100,40);c.lineTo(126,28);c.lineTo(150,30);c.lineTo(208,58);c.lineTo(208,80);c.closePath()},
    win(c){c.moveTo(110,40);c.lineTo(128,31);c.lineTo(148,32);c.lineTo(168,43);c.closePath()},wheels:[56,172],wy:82,rx:17,ry:20},
  bubble:{path(c){c.moveTo(24,80);c.lineTo(22,56);c.quadraticCurveTo(26,40,60,38);c.lineTo(84,38);c.quadraticCurveTo(102,14,140,15);c.quadraticCurveTo(176,17,188,42);c.quadraticCurveTo(206,48,206,66);c.lineTo(206,80);c.closePath()},
    win(c){c.moveTo(96,38);c.quadraticCurveTo(112,22,138,22);c.quadraticCurveTo(162,24,174,42);c.closePath()},wheels:[62,166],wy:82,rx:18,ry:20},
  muscle:{path(c){c.moveTo(14,80);c.lineTo(14,50);c.lineTo(72,46);c.lineTo(96,26);c.lineTo(150,26);c.lineTo(170,46);c.lineTo(210,50);c.lineTo(210,80);c.closePath()},
    win(c){c.moveTo(104,44);c.lineTo(118,31);c.lineTo(146,31);c.lineTo(158,44);c.closePath()},wheels:[56,172],wy:82,rx:17,ry:20},
  truck:{path(c){c.moveTo(14,80);c.lineTo(14,44);c.lineTo(100,44);c.lineTo(104,18);c.lineTo(150,18);c.lineTo(172,46);c.lineTo(210,50);c.lineTo(210,80);c.closePath()},
    win(c){c.moveTo(112,42);c.lineTo(114,25);c.lineTo(146,25);c.lineTo(162,42);c.closePath()},wheels:[52,172],wy:82,rx:19,ry:21},
  stock:{path(c){c.moveTo(16,80);c.lineTo(16,52);c.lineTo(80,46);c.lineTo(102,26);c.lineTo(148,25);c.lineTo(168,44);c.lineTo(206,48);c.quadraticCurveTo(212,56,210,80);c.closePath()},
    win(c){c.moveTo(108,44);c.lineTo(112,31);c.lineTo(144,30);c.lineTo(158,44);c.closePath()},wheels:[56,170],wy:82,rx:18,ry:20},
  rally:{path(c){c.moveTo(34,82);c.lineTo(32,40);c.lineTo(40,22);c.lineTo(120,20);c.lineTo(150,44);c.lineTo(196,52);c.quadraticCurveTo(204,60,200,82);c.closePath()},
    win(c){c.moveTo(96,24);c.lineTo(118,24);c.lineTo(142,44);c.lineTo(96,44);c.closePath()},wheels:[66,168],wy:82,rx:19,ry:21},
  gt:{path(c){c.moveTo(10,78);c.lineTo(10,54);c.quadraticCurveTo(50,50,96,40);c.quadraticCurveTo(122,24,148,30);c.lineTo(172,46);c.quadraticCurveTo(206,50,212,66);c.lineTo(210,78);c.closePath()},
    win(c){c.moveTo(112,38);c.quadraticCurveTo(126,30,146,33);c.lineTo(162,45);c.lineTo(112,45);c.closePath()},wheels:[54,170],wy:80,rx:18,ry:20},
  buggy:{path(c){c.moveTo(20,74);c.lineTo(22,48);c.lineTo(70,44);c.lineTo(84,22);c.lineTo(140,22);c.lineTo(156,44);c.lineTo(200,50);c.lineTo(206,74);c.closePath()},
    win(c){c.moveTo(92,42);c.lineTo(100,28);c.lineTo(136,28);c.lineTo(146,42);c.closePath()},wheels:[56,172],wy:78,rx:22,ry:24},
  formula:{path(c){c.moveTo(30,74);c.lineTo(38,58);c.lineTo(100,54);c.lineTo(116,42);c.lineTo(140,42);c.lineTo(150,54);c.lineTo(198,62);c.lineTo(214,74);c.closePath()},
    win:null,wheels:[50,180],wy:78,rx:20,ry:22}
};
function drawSide(c,d,w){const S=SHAPES[d.shape],s=w/220,A=d.accent;c.save();c.scale(s,s);c.lineJoin='round';c.lineCap='round';c.strokeStyle='#222';
  // rear spoilers / wings
  c.fillStyle=d.spoiler;
  if(d.id==='grigio'){c.fillRect(16,28,6,22);c.fillRect(30,28,6,20);c.fillRect(6,20,36,9)}
  else if(d.id==='lime'){c.beginPath();c.moveTo(22,52);c.lineTo(24,30);c.lineTo(32,30);c.lineTo(36,50);c.fill()}
  else if(d.id==='azzurro'){c.fillRect(20,40,6,12);c.fillRect(16,38,14,5)}
  else if(d.id==='viola'){c.beginPath();c.moveTo(14,50);c.lineTo(10,42);c.lineTo(34,46);c.lineTo(34,50);c.fill()}
  else if(d.id==='rosso'){c.fillRect(12,38,22,6)}
  else if(d.id==='drago'){c.fillRect(18,22,6,32);c.fillRect(34,24,6,28);c.fillStyle='#14482a';rr(c,2,12,46,12,4);c.fill();c.fillStyle=d.accent;c.fillRect(4,15,42,3);c.fillStyle=d.spoiler}
  else if(d.id==='bosco'){c.fillRect(16,36,30,7);c.fillRect(22,42,5,10)}
  else if(d.id==='rally'){c.fillRect(28,16,22,6);c.fillRect(30,20,4,6)}
  else if(d.id==='cometa'){c.fillRect(10,40,26,7)}
  else if(d.id==='neve'){c.fillRect(22,36,6,30);c.fillRect(8,28,34,10)}
  c.beginPath();S.path(c);c.fillStyle=d.body;c.fill();
  c.save();c.beginPath();S.path(c);c.clip();c.fillStyle=A;c.strokeStyle=A;
  if(d.id==='azzurro'){c.beginPath();c.moveTo(60,62);c.lineTo(110,62);c.lineTo(126,84);c.lineTo(60,84);c.fill()}
  if(d.id==='grigio'){c.lineWidth=4;[[62,52],[100,56],[160,54]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,12,.2,Math.PI*.9);c.stroke()});c.beginPath();c.moveTo(76,64);c.lineTo(94,82);c.lineTo(76,82);c.fill()}
  if(d.id==='viola'){c.fillRect(74,62,90,22)}
  if(d.id==='rosso'){c.fillRect(14,48,86,4);c.fillStyle='#1d3fa0';c.fillRect(14,70,196,5);c.fillStyle=A;star(c,40,62,7);star(c,70,62,7)}
  if(d.id==='neve'){c.fillRect(38,62,180,5)}
  if(d.id==='drago'){const fl=(col,o)=>{c.fillStyle=col;c.beginPath();c.moveTo(70,76);c.lineTo(70,50+o);

function collide(){const D=30*CS;for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d<D&&d>0){const o=(D-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*o;a.y-=uy*o;b.x+=ux*o;b.y+=uy*o;a.v*=.988;b.v*=.988}}}
function ranking(){return cars.slice().sort((a,b)=>{if(a.done&&b.done)return a.time-b.time;if(a.done)return-1;if(b.done)return 1;return(b.lap*N+b.idx)-(a.lap*N+a.idx)})}

const hud=document.getElementById('hud'),lapEl=document.getElementById('lap'),posEl=document.getElementById('pos'),countEl=document.getElementById('count');
function update(dt){parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt});parts=parts.filter(p=>p.life>0);
  if(state==='countdown'){cd-=dt;const n=Math.ceil(cd);if(n!==lastCd){lastCd=n;if(n>0){showCount(n);beep(440,.18)}else{showCount('VIA!');beep(880,.4);state='race'}}}
  if(state!=='countdown'){if(state==='race'||state==='finished'){raceTime+=dt;cd-=dt}
    if(countEl.textContent==='VIA!'&&cd<-.8)countEl.hidden=true;
    cars.forEach(c=>{c.draft=false;const ca=Math.cos(c.a),sa=Math.sin(c.a);cars.forEach(o=>{if(o===c)return;const dx=o.x-c.x,dy=o.y-c.y,f=dx*ca+dy*sa,sd=-dx*sa+dy*ca;if(f>30&&f<170&&Math.abs(sd)<28)c.draft=true})});
    cars.forEach(c=>{const me=c.isPlayer&&!c.done&&state!=='demo';c.boost=false;
      if(me){c.boost=input.turbo&&c.turbo>.02;c.turbo=c.boost?Math.max(0,c.turbo-dt*.4):Math.min(1,c.turbo+dt*.2);if(c.boost&&!c.wasBoost)beep(220,.25,'sawtooth');c.wasBoost=c.boost}
      if(me){c.laneT=clamp(c.laneT+((input.right?1:0)-(input.left?1:0))*dt*170,-TW+22,TW-24)}
      let tc=me?[input.brake?-1:1,autoSteer(c,c.laneT)]:ai(c,dt);
      physics(c,tc[0],tc[1],dt);nearest(c);
      if(state!=='demo'&&!c.done&&c.lap>LAPS){c.done=true;c.time=raceTime;finishOrder.push(c);
        if(c.isPlayer){state='finished';endTimer=1.6;cheer();fanfare()}}});
    collide()}
  if(state==='finished'){endTimer-=dt;if(endTimer<=0&&document.getElementById('end').hidden)showEnd()}
  const f=player||ranking()[0];if(f){const tx=f.x+Math.cos(f.a)*f.v*.2,ty=f.y+Math.sin(f.a)*f.v*.2;const k=Math.min(1,dt*(player?5:2));cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k}
  if(player){const r=ranking(),pos=r.indexOf(player)+1;lapEl.textContent=Math.max(1,Math.min(player.lap,LAPS))+'/'+LAPS;posEl.textContent=pos+'°/'+cars.length;
    spdEl.textContent=Math.round(Math.abs(player.v)*.38);tbar.style.width=Math.round(player.turbo*100)+'%';turboBtn.classList.toggle('low',player.turbo<.1);
    if(state==='race'){toastCd-=dt;
      if(player.lap!==hudLap){if(player.lap===LAPS&&hudLap<LAPS)toast('Ultimo giro!');else if(player.lap>1&&player.lap>hudLap&&player.lap<LAPS)toast('Giro '+player.lap);hudLap=player.lap}
      if(pos<hudPos&&toastCd<=0){toast(pos===1?'Sei primo!':'Sorpasso!');toastCd=1.5}}
    hudPos=pos;engine(player.v,player.boost)}}
const spdEl=document.getElementById('spd'),tbar=document.getElementById('tbar'),turboBtn=document.getElementById('turboBtn'),toastEl=document.getElementById('toast');
let hudLap=0,hudPos=6,toastCd=0;
function toast(t){toastEl.hidden=false;toastEl.textContent=t;toastEl.classList.remove('pop');void toastEl.offsetWidth;toastEl.classList.add('pop');clearTimeout(toast.t);toast.t=setTimeout(()=>{toastEl.hidden=true},1300);beep(700,.1,'triangle')}
let eng=null;
function engineStart(){if(!AC||eng)return;try{const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=700;g.gain.value=.025;o.connect(f).connect(g).connect(AC.destination);o.frequency.value=45;o.start();eng={o}}catch(e){}}
function engineStop(){if(eng){try{eng.o.stop()}catch(e){}eng=null}}
function engine(v,b){if(eng)try{eng.o.frequency.setTargetAtTime(45+Math.abs(v)*.2+(b?35:0),AC.currentTime,.05)}catch(e){}}
function cheer(){if(!AC)return;try{const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=1200;f.Q.value=.6;g.gain.value=.25;s.buffer=buf;s.connect(f).connect(g).connect(AC.destination);s.start()}catch(e){}}
function fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,i===3?.6:.18,'triangle'),i*170))}
const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cf=document.getElementById('confetti'),cfx=cf.getContext('2d');let conf=[];
function confettiStart(){if(reduceMotion)return;cf.hidden=false;const w=innerWidth,h=innerHeight;cf.width=w*DPR;cf.height=h*DPR;cf.style.width=w+'px';cf.style.height=h+'px';conf=[];
  const cols=['#ffc93c','#e63946','#4cc9e0','#7cc934','#f39025','#5b3a8e','#ffffff'];
  for(let i=0;i<170;i++)conf.push({x:Math.random()*w,y:-Math.random()*h,vx:(Math.random()-.5)*60,vy:90+Math.random()*140,r:Math.random()*6,s:5+Math.random()*7,c:cols[i%7],w:(Math.random()-.5)*8})}
function confettiDraw(dt){if(cf.hidden)return;cfx.setTransform(DPR,0,0,DPR,0,0);cfx.clearRect(0,0,innerWidth,innerHeight);
  conf.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.w*dt;if(p.y>innerHeight+20){p.y=-10;p.x=Math.random()*innerWidth}
    cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.r);cfx.fillStyle=p.c;cfx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cfx.restore()})}
function showCount(t){countEl.hidden=false;countEl.textContent=t;countEl.classList.remove('pop');void countEl.offsetWidth;countEl.classList.add('pop')}

function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#4d9a47';ctx.fillRect(0,0,W,H);
  const z=player?Z:Z*.6;ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
  // parking lot beyond stands
  ctx.fillStyle='#8d8a82';ctx.fillRect(BX.minX-400,BX.minY-400,BX.maxX-BX.minX+800,BX.maxY-BX.minY+800);
  // infield mowing stripes
  ctx.save();ctx.clip(P.infield);ctx.fillStyle='#5aa952';ctx.fillRect(-R,-R,L+2*R,2*R);ctx.fillStyle='#66b85d';for(let x=-R;x<L+R;x+=120)ctx.fillRect(x,-R,60,2*R);
  ctx.font='bold 70px '+DF();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('GRAN PREMIO',L/2,-60);ctx.fillText('DEI DISEGNI',L/2,30);
  // pit road
  const py0=R-TW-APRON-75;ctx.fillStyle='#62626c';ctx.fillRect(160,py0,L-320,70);ctx.fillStyle='#ffffff';ctx.fillRect(160,py0+66,L-320,4);
  for(let x=200;x<L-200;x+=80){ctx.fillStyle='#ffc93c';ctx.fillRect(x,py0+6,4,40)}ctx.restore();
  ctx.fillStyle='#bdb6a6';ctx.fill(P.stands,'evenodd');
  crowd.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x-4,p.y-4,8,8)});
  ctx.fillStyle='#e63946';ctx.fill(P.roof,'evenodd');
  ctx.fillStyle='#f4f4f6';ctx.fill(P.wall,'evenodd');
  ctx.lineCap='butt';ctx.lineWidth=10;ctx.setLineDash([70,150]);ctx.strokeStyle='#2f6fe4';ctx.stroke(LINES.wallMid);ctx.lineDashOffset=110;ctx.strokeStyle='#ffc93c';ctx.stroke(LINES.wallMid);ctx.setLineDash([]);ctx.lineDashOffset=0;
  ctx.fillStyle='#7c7c86';ctx.fill(P.apron,'evenodd');
  ctx.fillStyle='#4d4d57';ctx.fill(P.road,'evenodd');
  ctx.lineWidth=4;ctx.strokeStyle='#ffffff';ctx.stroke(LINES.outer);ctx.lineWidth=3;ctx.strokeStyle='#ffd23f';ctx.stroke(LINES.y1);ctx.stroke(LINES.y2);
  // start/finish
  const p0=PTS[0],sq=TW/6;ctx.save();ctx.translate(p0.x,p0.y);ctx.rotate(p0.a);for(let r=0;r<2;r++)for(let i=-6;i<6;i++){ctx.fillStyle=(i+r)%2?'#111':'#fff';ctx.fillRect(r*sq-sq,i*sq,sq,sq)}ctx.restore();
  // turn numbers on the apron
  ctx.font='bold 40px '+DF();ctx.fillStyle='rgba(255,255,255,.8)';[[1,.33],[2,.67],[3,1.33],[4,1.67]].forEach(([n,t],i)=>{const s=L/2+(i<2?0:L+Math.PI*R)+t*0+(i<2?Math.PI*R*(i?0.7:0.3):Math.PI*R*(i===2?0.3:0.7)),p=posAt(s);ctx.fillText(n,p.x-nx(p)*(TW+25),p.y-ny(p)*(TW+25))});
  parts.forEach(p=>{ctx.fillStyle=p.fire?'rgba(255,'+Math.round(110+p.life*450)+',40,'+Math.min(1,p.life*3.3)+')':p.spark?'rgba(255,200,60,'+(p.life*2)+')':'rgba(120,170,90,'+(p.life*.8)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.spark?p.r:p.r*(1.6-p.life),0,7);ctx.fill()});
  cars.forEach(c=>drawTop(ctx,c));
  if(player){ctx.fillStyle='#ffc93c';ctx.strokeStyle='#1f1d2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x-9,player.y-42);ctx.lineTo(player.x+9,player.y-42);ctx.lineTo(player.x,player.y-31);ctx.closePath();ctx.fill();ctx.stroke()}
  ctx.restore();if(player)drawMini()}
const mini=document.getElementById('mini'),mc=mini.getContext('2d');const miniPath=line(0);
function drawMini(){const w=260,h=160,s=Math.min((w-40)/(L+2*R+2*TW),(h-40)/(2*R+2*TW));
  mc.clearRect(0,0,w,h);mc.save();mc.translate(w/2-(L/2)*s,h/2);mc.scale(s,s);mc.strokeStyle='#4d4d57';mc.lineWidth=2*TW;mc.stroke(miniPath);
  cars.forEach(c=>{if(c===player)return;mc.fillStyle=c.d.body;mc.strokeStyle='#222';mc.lineWidth=3/s;mc.beginPath();mc.arc(c.x,c.y,7/s,0,7);mc.fill();mc.stroke()});
  mc.fillStyle='#ffc93c';mc.strokeStyle='#222';mc.lineWidth=3/s;mc.beginPath();mc.arc(player.x,player.y,10/s,0,7);mc.fill();mc.stroke();mc.restore()}
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);render();confettiDraw(dt);requestAnimationFrame(loop)}

/* ---------- flow ---------- */
const menu=document.getElementById('menu'),end=document.getElementById('end'),controls=document.getElementById('controls');
const touch=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
function start(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}
  setup(chosen);menu.hidden=true;end.hidden=true;hud.hidden=false;controls.hidden=!touch;state='countdown';cd=3.2;lastCd=4;hudLap=0;hudPos=cars.length;cf.hidden=true;toastEl.hidden=true;engineStart();
  cam.x=player.x;cam.y=player.y;Object.keys(input).forEach(k=>input[k]=false)}
function showEnd(){const r=ranking(),me=r.indexOf(player)+1;
  document.getElementById('endTitle').textContent=me===1?'HAI VINTO! 🏆':me<=3?'Bravissimo! Sei sul podio!':'Bravo! Sei arrivato '+me+'°!';
  document.getElementById('stars').textContent=me===1?'★★★':me<=3?'★★☆':'★☆☆';
  engineStop();confettiStart();
  const pod=document.getElementById('podium');pod.textContent='';
  [1,0,2].forEach(i=>{const c=r[i];if(!c)return;const box=document.createElement('div');const cv=document.createElement('canvas');cv.width=300;cv.height=150;
    const g=cv.getContext('2d');g.translate(0,4);drawSide(g,c.d,300);const s=document.createElement('span');const hh=[64,44,30][i];
    s.textContent=(i+1)+'°';s.style.height=hh+'px';s.style.lineHeight=(hh-6)+'px';s.style.background=['#ffc93c','#d9d9e0','#e8a46a'][i];box.append(cv,s);pod.append(box)});
  const ol=document.getElementById('results');ol.textContent='';
  r.forEach((c,i)=>{const li=document.createElement('li');if(c===player)li.className='me';
    const p=document.createElement('span');p.className='p';p.textContent=(i+1)+'°';
    const n=document.createElement('span');const sw=document.createElement('i');sw.style.background=c.d.body;n.append(sw,c.d.name+(c===player?' (tu)':''));
    const t=document.createElement('span');t.className='t';t.textContent=c.done?c.time.toFixed(2)+' s':'in arrivo';li.append(p,n,t);ol.append(li)});
  end.hidden=false;controls.hidden=true}
document.getElementById('go').addEventListener('click',start);
document.getElementById('again').addEventListener('click',start);
document.getElementById('change').addEventListener('click',()=>{engineStop();cf.hidden=true;end.hidden=true;hud.hidden=true;controls.hidden=true;setup(null);state='demo';menu.hidden=false});
const KEYS={' ':'turbo',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake'};
window.addEventListener('keydown',e=>{if(KEYS[e.key]){input[KEYS[e.key]]=true;e.preventDefault()}if(e.key==='Enter'&&!menu.hidden)start()});
window.addEventListener('keyup',e=>{if(KEYS[e.key])input[KEYS[e.key]]=false});
window.addEventListener('blur',()=>Object.keys(input).forEach(k=>input[k]=false));
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}input[k]=true;b.classList.add('on')});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{input[k]=false;b.classList.remove('on')}));
  b.addEventListener('contextmenu',e=>e.preventDefault())});
setup(null);requestAnimationFrame(loop);
})();
</script>
